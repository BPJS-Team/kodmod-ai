# VPS: one Compose project, only Caddy exposes public ports.
name: kodmod

x-api: &api
  image: kodmod/ai-engine:${KODMOD_TAG:-vps}
  build:
    context: ../../apps/ai-engine
    args:
      INSTALL_RERANKER: ${INSTALL_RERANKER:-false}
  env_file: ../../apps/ai-engine/.env
  environment:
    ENV: prod
    DEBUG: "false"
    LOG_JSON: "true"
    API_HOST: 0.0.0.0
    API_PORT: 8000
    DB_HOST: postgres
    DB_PORT: 5432
    DB_USER: ${DB_USER:-kodmod}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env}
    DB_NAME: ${DB_NAME:-kodmod}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    AUDIO_DIR: /var/lib/kodmod/audio
    UPLOAD_DIR: /var/lib/kodmod/uploads
    CORS_ALLOW_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN in the root .env}
    RAG_RERANK_ENABLED: ${RAG_RERANK_ENABLED:-false}
  volumes:
    - kodmod-audio:/var/lib/kodmod/audio
    - kodmod-uploads:/var/lib/kodmod/uploads

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-kodmod}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env}
      POSTGRES_DB: ${DB_NAME:-kodmod}
    volumes: ["kodmod-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["kodmod-redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *api
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"
    healthcheck: { disable: true }
    depends_on:
      postgres: { condition: service_healthy }

  ai-engine:
    <<: *api
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    image: kodmod/web:${KODMOD_TAG:-vps}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        API_ORIGIN: http://ai-engine:8000
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      SESSION_COOKIE_SECURE: "true"
      API_ORIGIN: http://ai-engine:8000
    depends_on:
      ai-engine: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in the root .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in the root .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - kodmod-caddydata:/data
      - kodmod-caddyconfig:/config
    depends_on:
      web: { condition: service_healthy }

volumes:
  kodmod-pgdata:
  kodmod-redisdata:
  kodmod-audio:
  kodmod-uploads:
  kodmod-caddydata:
  kodmod-caddyconfig:
