# VPS: one Compose project, only Caddy exposes public ports.
name: kodmod

x-api: &api
  image: kodmod/ai-engine:${KODMOD_TAG:-vps}
  build:
    context: ../../apps/ai-engine
    args:
      INSTALL_RERANKER: ${INSTALL_RERANKER:-false}
  env_file: ../../apps/ai-engine/.env
  environment:
    ENV: prod
    DEBUG: "false"
    LOG_JSON: "true"
    API_HOST: 0.0.0.0
    API_PORT: 8000
    DB_HOST: postgres
    DB_PORT: 5432
    DB_USER: ${DB_USER:-kodmod}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env}
    DB_NAME: ${DB_NAME:-kodmod}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    AUDIO_DIR: /var/lib/kodmod/audio
    UPLOAD_DIR: /var/lib/kodmod/uploads
    CORS_ALLOW_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN in the root .env}
    RAG_RERANK_ENABLED: ${RAG_RERANK_ENABLED:-false}
  volumes:
    - kodmod-audio:/var/lib/kodmod/audio
    - kodmod-uploads:/var/lib/kodmod/uploads

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-kodmod}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the root .env}
      POSTGRES_DB: ${DB_NAME:-kodmod}
    volumes: ["kodmod-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["kodmod-redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *api
    command: ["python", "-m", "alembic", "upgrade", "head"]
    restart: "no"
    healthcheck: { disable: true }
    depends_on:
      postgres: { condition: service_healthy }

  ai-engine:
    <<: *api
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    <<: *api
    command: ["python", "-m", "api.material_worker"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; import time; p=Path('/tmp/kodmod-worker-heartbeat'); assert p.exists() and time.time()-p.stat().st_mtime<90"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    image: kodmod/web:${KODMOD_TAG:-vps}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        API_ORIGIN: http://ai-engine:8000
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      SESSION_COOKIE_SECURE: "true"
      API_ORIGIN: http://ai-engine:8000
    depends_on:
      ai-engine: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in the root .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in the root .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - kodmod-caddydata:/data
      - kodmod-caddyconfig:/config
    depends_on:
      web: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}
    volumes:
      - type: bind
        source: ./prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: bind
        source: ./prometheus-alerts.yml
        target: /etc/prometheus/rules.yml
        read_only: true
      - type: bind
        source: ${MONITORING_DATA_ROOT:?Set MONITORING_DATA_ROOT in the root .env}/prometheus
        target: /prometheus
        bind: { create_host_path: true }
    depends_on:
      cadvisor: { condition: service_started }
    mem_limit: 512m
    cpus: 0.50
    logging:
      options: { max-size: 10m, max-file: "3" }

  grafana:
    image: grafana/grafana:13.2.3
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in the root .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3001}/
      GF_SECURITY_COOKIE_SECURE: "false"
    ports: ["127.0.0.1:${GRAFANA_PORT:-3001}:3000"]
    volumes:
      - type: bind
        source: ${MONITORING_DATA_ROOT:?Set MONITORING_DATA_ROOT in the root .env}/grafana
        target: /var/lib/grafana
        bind: { create_host_path: true }
      - type: bind
        source: ./grafana/provisioning
        target: /etc/grafana/provisioning
        read_only: true
      - type: bind
        source: ./grafana/dashboards
        target: /var/lib/grafana/dashboards
        read_only: true
    depends_on:
      prometheus: { condition: service_started }
    mem_limit: 512m
    cpus: 0.25
    logging:
      options: { max-size: 10m, max-file: "3" }

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    profiles: ["monitoring"]
    restart: unless-stopped
    privileged: true
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - type: bind
        source: /
        target: /rootfs
        read_only: true
      - type: bind
        source: /var/run
        target: /var/run
        read_only: true
      - type: bind
        source: /sys
        target: /sys
        read_only: true
      - type: bind
        source: /var/lib/docker
        target: /var/lib/docker
        read_only: true
      - type: bind
        source: /dev/disk
        target: /dev/disk
        read_only: true
    mem_limit: 512m
    cpus: 0.25
    logging:
      options: { max-size: 10m, max-file: "3" }

  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    profiles: ["monitoring-linux"]
    restart: unless-stopped
    pid: host
    read_only: true
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+)($|/)
    volumes:
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
      - type: bind
        source: /
        target: /host
        read_only: true
    mem_limit: 128m
    cpus: 0.10
    logging:
      options: { max-size: 10m, max-file: "3" }

volumes:
  kodmod-pgdata:
  kodmod-redisdata:
  kodmod-audio:
  kodmod-uploads:
  kodmod-caddydata:
  kodmod-caddyconfig:
