# KODMOD AI - infrastruktur pengembangan lokal.
#   docker compose up -d            → postgres + redis
#   docker compose --profile api up → sekalian jalankan ai-engine di container
#   docker compose --profile qdrant up -d → tambah Qdrant (opsional)

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kodmod-postgres
    environment:
      POSTGRES_USER: kodmod
      POSTGRES_PASSWORD: kodmod
      POSTGRES_DB: kodmod
    ports:
      - "5433:5432"
    volumes:
      - kodmod-pgdata:/var/lib/postgresql/data
    # Apply the current schema with Alembic after PostgreSQL is ready.
    # The archived schema.sql predates the users/class-materials schema.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kodmod -d kodmod"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kodmod-redis
    ports:
      - "6379:6379"
    volumes:
      - kodmod-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.10.1
    container_name: kodmod-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - kodmod-qdrantdata:/qdrant/storage
    profiles: ["qdrant"]

  ai-engine:
    build:
      context: ./apps/ai-engine
      dockerfile: Dockerfile
    container_name: kodmod-ai-engine
    profiles: ["api"]
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    env_file:
      - ./apps/ai-engine/.env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DB_HOST: postgres
      DB_PORT: 5432
      REDIS_HOST: redis
    ports:
      - "8109:8000"
    volumes:
      - kodmod-audio:/var/lib/kodmod/audio
      - kodmod-uploads:/var/lib/kodmod/uploads

volumes:
  kodmod-pgdata:
  kodmod-redisdata:
  kodmod-qdrantdata:
  kodmod-audio:
  kodmod-uploads:
