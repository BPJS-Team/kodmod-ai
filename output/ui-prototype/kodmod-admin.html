<style>
#ka-admin{--ka-blue:#1d63d8;--ka-navy:#103c80;--ka-ink:#142d4e;--ka-muted:#52677f;--ka-line:#dce6f3;--ka-radius:16px;font:16px/1.55 'Source Sans 3',sans-serif;color:var(--ka-ink);color-scheme:light}
#ka-admin *{box-sizing:border-box;min-width:0}#ka-admin [hidden]{display:none!important}#ka-admin button,#ka-admin input,#ka-admin select{font:inherit}#ka-admin button{cursor:pointer}#ka-admin button:disabled{cursor:not-allowed;opacity:.55}#ka-admin h1,#ka-admin h2,#ka-admin h3{font-family:'Plus Jakarta Sans',sans-serif;line-height:1.3;letter-spacing:-.035em;color:var(--ka-ink);margin:0 0 12px;font-weight:700}#ka-admin h1{font-size:30px}#ka-admin h2{font-size:20px}#ka-admin h3{font-size:17px}#ka-admin p{margin:0 0 16px}#ka-admin small{font-size:13px;color:var(--ka-muted)}#ka-admin svg{flex-shrink:0}#ka-admin .ka-muted{color:var(--ka-muted)}
#ka-admin .ka-review{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0;color:light-dark(#142d4e,#d9eaff);color-scheme:light dark}#ka-admin .ka-review strong{font:600 13px 'Plus Jakarta Sans',sans-serif}#ka-admin .ka-review button{border:1px solid #dce6f3;border-radius:8px;background:#fff;color:#52677f;padding:10px 15px}#ka-admin .ka-review button[aria-pressed=true]{background:#103c80;color:white}
#ka-admin .ka-window{container-type:inline-size;background:#f3f8ff;border:1px solid var(--ka-line);border-radius:18px;width:100%;margin:auto;overflow:clip}#ka-admin .ka-window.ka-phone{max-width:390px}#ka-admin .ka-demo{padding:8px 18px;background:#e8f1ff;color:var(--ka-navy);font-size:13px;text-align:center}#ka-admin .ka-shell{display:grid;grid-template-columns:204px minmax(0,1fr)}#ka-admin .ka-side{background:white;border-right:1px solid var(--ka-line);padding:26px 14px;display:flex;flex-direction:column;gap:26px}#ka-admin .ka-logo{width:142px;height:auto;display:block;margin:0 8px 8px}#ka-admin .ka-side small{padding:0 12px;text-transform:uppercase;letter-spacing:.12em;font-size:11px}#ka-admin .ka-side nav{display:grid;gap:5px}#ka-admin .ka-nav{border:0;background:white;color:var(--ka-muted);display:flex;align-items:center;gap:10px;padding:12px;border-radius:10px;text-align:left;min-height:46px}#ka-admin .ka-nav[aria-current=page]{color:var(--ka-navy);background:#eaf2ff;font-weight:700}#ka-admin .ka-sidefoot{border-top:1px solid var(--ka-line);padding:20px 10px;margin-top:24px}#ka-admin .ka-top{padding:18px 28px;background:white;border-bottom:1px solid var(--ka-line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:14px}#ka-admin .ka-avatar{display:inline-grid;place-items:center;width:34px;height:34px;background:#e8f1ff;color:var(--ka-navy);border-radius:50%;font-weight:700}#ka-admin .ka-topuser{display:flex;align-items:center;gap:9px}#ka-admin .ka-mobile{display:none}#ka-admin .ka-content{padding:28px;min-height:650px}#ka-admin .ka-title{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:24px}#ka-admin .ka-title p{color:var(--ka-muted);margin:0}#ka-admin .ka-eyebrow{color:var(--ka-blue);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-bottom:8px}
#ka-admin .ka-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:1px solid var(--ka-line);border-radius:10px;padding:10px 14px;background:white;color:var(--ka-navy);font-weight:600;text-decoration:none}#ka-admin .ka-primary{background:var(--ka-blue);color:#fff;border-color:var(--ka-blue)}#ka-admin .ka-danger{color:#a52938;border-color:#ecc4cc}#ka-admin .ka-textbtn{border:0;background:transparent;color:var(--ka-blue);font-weight:600;padding:10px 0;min-height:44px}#ka-admin .ka-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}#ka-admin .ka-panel{background:#fff;border:1px solid var(--ka-line);border-radius:var(--ka-radius);padding:22px;margin-bottom:20px}#ka-admin .ka-panelhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}#ka-admin .ka-panelhead h2{margin:0}#ka-admin .ka-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px}#ka-admin .ka-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}#ka-admin .ka-metric{padding:18px;background:#fff;border:1px solid var(--ka-line);border-radius:var(--ka-radius)}#ka-admin .ka-metric strong{display:block;font:700 30px 'Plus Jakarta Sans',sans-serif;color:var(--ka-navy);margin:8px 0}#ka-admin .ka-metric span{font-size:14px;color:var(--ka-muted)}#ka-admin .ka-badge{display:inline-block;background:#eaf2ff;color:var(--ka-navy);border-radius:5px;padding:3px 8px;font-size:12px;font-weight:600;white-space:normal}#ka-admin .ka-good{background:#e8f7ef;color:#176145}#ka-admin .ka-warn{background:#fff1db;color:#81480d}#ka-admin .ka-bad{background:#ffedf0;color:#9d2430}#ka-admin .ka-notice{border-left:3px solid var(--ka-blue);background:#eaf2ff;padding:14px 16px;color:var(--ka-navy);margin:16px 0;border-radius:0 10px 10px 0}#ka-admin .ka-alert{padding:12px 16px;background:#fff1db;color:#81480d;border-radius:8px;margin:12px 0}#ka-admin .ka-filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin-bottom:20px}#ka-admin label{display:grid;gap:7px;font-size:14px;font-weight:600}#ka-admin .ka-filters label{flex:1 1 130px}#ka-admin input,#ka-admin select{border:1px solid #a2b6cf;background:white;color:var(--ka-ink);border-radius:9px;padding:10px 12px;min-height:44px;width:100%}#ka-admin .ka-check{display:flex;align-items:center;gap:10px;font-size:16px;min-height:48px}#ka-admin input[type=checkbox]{width:20px;height:20px;min-height:20px;accent-color:var(--ka-blue)}#ka-admin .ka-formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}#ka-admin .ka-formgrid .ka-full{grid-column:1/-1}#ka-admin .ka-back{margin-bottom:18px}
#ka-admin table{border-collapse:collapse;width:100%;font-size:14px}#ka-admin th{text-align:left;color:var(--ka-muted);font-weight:600;font-size:12px;padding:12px 10px;background:#f6f9fe}#ka-admin td{padding:14px 10px;border-bottom:1px solid var(--ka-line);vertical-align:middle;overflow-wrap:anywhere}#ka-admin td strong{display:block;font-weight:600}#ka-admin td small{display:block}#ka-admin .ka-tablepanel{padding:0;overflow:hidden}#ka-admin .ka-tablepanel>.ka-panelhead{padding:20px 22px 0}#ka-admin .ka-tablefoot{padding:14px 20px;font-size:13px;color:var(--ka-muted)}#ka-admin .ka-empty{padding:34px 20px;text-align:center;color:var(--ka-muted)}#ka-admin .ka-row{padding:14px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--ka-line)}#ka-admin .ka-row:last-child{border:0}#ka-admin .ka-row p{margin:3px 0 0;color:var(--ka-muted);font-size:14px}#ka-admin .ka-logmark{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:9px;background:#eaf2ff;color:var(--ka-blue);flex-shrink:0}#ka-admin .ka-logline{display:flex;gap:12px;align-items:flex-start}#ka-admin .ka-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;align-items:end;height:186px;margin:18px 0 10px}#ka-admin .ka-barcol{display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end;gap:6px;font-size:12px;color:var(--ka-muted)}#ka-admin .ka-bar{background:var(--ka-blue);width:100%;max-width:36px;border-radius:5px 5px 0 0;min-height:3px}#ka-admin .ka-track{height:7px;background:#e6eef9;border-radius:5px;margin:10px 0 14px;overflow:hidden}#ka-admin .ka-track span{height:100%;display:block;background:var(--ka-blue)}#ka-admin .ka-total{font:700 28px 'Plus Jakarta Sans',sans-serif;color:var(--ka-navy)}#ka-admin .ka-dl{display:grid;grid-template-columns:1fr 1.5fr;gap:12px;margin:0}#ka-admin dt{color:var(--ka-muted)}#ka-admin dd{margin:0;overflow-wrap:anywhere}#ka-admin .ka-live:empty{display:none}#ka-admin .ka-live{background:#e8f7ef;color:#176145;padding:12px 20px;border-top:1px solid #c8e6d6}#ka-admin .ka-rolegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}#ka-admin .ka-rolegrid ul{padding-left:18px;font-size:14px;color:var(--ka-muted)}
@container(max-width:850px){#ka-admin .ka-shell{grid-template-columns:168px minmax(0,1fr)}#ka-admin .ka-side{padding:24px 8px}#ka-admin .ka-logo{width:128px}#ka-admin .ka-content{padding:22px}#ka-admin .ka-grid{grid-template-columns:1fr}#ka-admin .ka-metrics{gap:9px}#ka-admin .ka-metric{padding:14px}#ka-admin .ka-rolegrid{grid-template-columns:1fr}}
@container(max-width:640px){#ka-admin .ka-shell{display:block}#ka-admin .ka-side{display:none}#ka-admin .ka-mobile{display:block;width:100%}#ka-admin .ka-top{padding:16px 18px}#ka-admin .ka-top>span{font-size:13px}#ka-admin .ka-content{padding:22px 16px;min-height:400px}#ka-admin h1{font-size:25px}#ka-admin .ka-metrics{grid-template-columns:1fr}#ka-admin .ka-metric{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:12px}#ka-admin .ka-metric strong{grid-column:2;grid-row:1/3;font-size:27px}#ka-admin .ka-metric small{grid-column:1}#ka-admin .ka-formgrid{grid-template-columns:1fr}#ka-admin .ka-panel{padding:18px}#ka-admin .ka-tablepanel{padding:0}#ka-admin table,#ka-admin tbody,#ka-admin tr,#ka-admin td{display:block;width:100%}#ka-admin thead{display:none}#ka-admin tr{padding:12px 18px;border-bottom:1px solid var(--ka-line)}#ka-admin td{border:0;padding:6px 0}#ka-admin td[data-label]:before{content:attr(data-label) ' · ';font-size:12px;color:var(--ka-muted)}#ka-admin .ka-dl{grid-template-columns:1fr;gap:5px}#ka-admin dd{margin-bottom:12px}#ka-admin .ka-bars{gap:6px}#ka-admin .ka-panelhead{align-items:flex-start}#ka-admin .ka-row{flex-wrap:wrap}}
</style>

const roleName=r=>({admin:'Admin',teacher:'Guru',student:'Siswa'}[r]);

function addLog(type,action,target,detail){logs.unshift({id:Date.now(),time:'Baru saja · simulasi',actor:'Bayu Saputra',type,action,target,result:'Berhasil',detail});}
function title(h,p,action=''){return `<div class="ka-title"><div><div class="ka-eyebrow">Administrasi sekolah</div><h1>${h}</h1><p>${p}</p></div>${action}</div>`;}
function period(){return `<label>Periode<select id="ka-period"><option value="7" ${state.period==='7'?'selected':''}>9–15 Sep 2026</option><option value="prev" ${state.period==='prev'?'selected':''}>2–8 Sep 2026</option></select></label>`;}
function metrics(items){return `<div class="ka-metrics">${items.map(([label,value,note])=>`<div class="ka-metric"><span>${label}</span><strong>${value}</strong><small>${note}</small></div>`).join('')}</div>`;}
function chart(){const a=state.period==='7'?[8,12,10,15,9,6,14]:[6,8,7,10,8,4,9];return `<section class="ka-panel"><div class="ka-panelhead"><div><h2>Aktivitas belajar</h2><small>Sesi tutor per hari</small></div><span class="ka-total">${a.reduce((x,y)=>x+y,0)}</span></div><div class="ka-bars" role="img" aria-label="${a.map((v,i)=>`${i+(state.period==='7'?9:2)} September: ${v} sesi`).join('; ')}">${a.map((v,i)=>`<div class="ka-barcol"><span>${v}</span><div class="ka-bar" style="height:${v/16*130}px"></div><span>${i+(state.period==='7'?9:2)} Sep</span></div>`).join('')}</div><small>Data contoh · satu sesi adalah satu percakapan belajar.</small></section>`;}
function activity(limit=3){return logs.slice(0,limit).map(l=>`<div class="ka-row"><div class="ka-logline"><span class="ka-logmark">${ico(l.result==='Gagal'?'triangle-alert':'history')}</span><div><strong>${esc(l.action)}</strong><p>${esc(l.actor)} · ${esc(l.target)}</p><small>${esc(l.time)}</small></div></div>${btn('Detail',`log:${l.id}`)}</div>`).join('');}
function home(){return title('Gambaran ruang belajar','Selamat datang, Bayu. Ini aktivitas sekolah pada data contoh.',btn(`${ico('user-plus')} Tambah pengguna`,'new-user',true))+metrics([['Akun terdaftar',users.length,`${users.filter(u=>u.active).length} akun aktif`],['Kelas',subjects.length,'Dua mata pelajaran'],['Perlu perhatian','2','Audio gagal dan materi ditinjau']])+`<div class="ka-grid">${chart()}<section class="ka-panel"><h2>Perlu ditindaklanjuti</h2><div class="ka-row"><div>${badge('Layanan','ka-warn')}<h3 style="margin-top:10px">1 audio belum tersedia</h3><p>Teks materi tetap dapat dibaca.</p>${btn('Lihat layanan','nav:services')}</div></div><div class="ka-row"><div>${badge('Materi')}<h3 style="margin-top:10px">1 materi perlu ditinjau</h3><p>Guru dapat memeriksa sebelum membagikan.</p>${btn('Lihat materi','nav:classes')}</div></div></section></div><section class="ka-panel"><div class="ka-panelhead"><h2>Aktivitas terbaru</h2>${btn('Semua aktivitas','nav:logs')}</div>${activity()}</section>`;}
function analytics(){const current=state.period==='7';return title('Analytics pembelajaran','Pahami penggunaan layanan dan partisipasi belajar.',period())+metrics([['Sesi tutor',current?74:52,'Jumlah sesi dalam periode'],['Kuis diselesaikan',current?12:9,'Dari '+(current?15:12)+' percobaan'],['Siswa berpartisipasi','2','Dari 3 akun siswa']])+`<div class="ka-grid">${chart()}<section class="ka-panel"><h2>Penyelesaian kuis</h2><p class="ka-total">${current?80:75}%</p><div class="ka-track" role="progressbar" aria-label="Persentase kuis selesai" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${current?80:75}"><span style="width:${current?80:75}%"></span></div><p class="ka-muted">${current?'12 dari 15':'9 dari 12'} percobaan telah dikirim.</p><small>Rasio penyelesaian, bukan nilai atau tingkat penguasaan siswa.</small></section></div><section class="ka-panel"><h2>Partisipasi menurut kelas</h2>${subjects.map((c,i)=>`<div class="ka-row"><div><strong>${c.name}</strong><p>${c.subject} · ${c.teacher}</p></div><div><strong>${i===0?'2 dari 2':'0 dari 1'} siswa</strong><small>Memulai sesi dalam periode</small></div></div>`).join('')}</section><div class="ka-notice">Data ditampilkan sebagai agregat sekolah. Pembahasan kebutuhan belajar per siswa dilakukan bersama guru.</div>`;}
function userRows(){const filtered=users.filter(u=>(state.role==='all'||u.role===state.role)&&(state.status==='all'||String(u.active)===state.status)&&`${u.name} ${u.username}`.toLowerCase().includes(state.query.toLowerCase()));return filtered.length?`<table><thead><tr><th>Pengguna</th><th>Peran</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${filtered.map(u=>`<tr><td><strong>${esc(u.name)}${u.id===1?' · Anda':''}</strong><small>@${esc(u.username)}</small></td><td data-label="Peran">${roleName(u.role)}</td><td data-label="Status">${badge(u.active?'Aktif':'Nonaktif',u.active?'ka-good':'')}</td><td>${btn('Kelola',`user:${u.id}`)}</td></tr>`).join('')}</tbody></table><div class="ka-tablefoot">${filtered.length} dari ${users.length} akun contoh</div>`:'<div class="ka-empty">Tidak ada pengguna yang cocok. Ubah kata pencarian atau filter.</div>';}
function userList(){return title('Pengguna','Kelola akun dan akses ke ruang belajar.',btn(`${ico('plus')} Tambah pengguna`,'new-user',true))+`<div class="ka-filters"><label>Cari nama atau username<input id="ka-userquery" type="search" value="${esc(state.query)}" placeholder="Misalnya Ahmad"></label><label>Peran<select id="ka-rolefilter">${[['all','Semua peran'],['student','Siswa'],['teacher','Guru'],['admin','Admin']].map(([v,t])=>`<option value="${v}" ${state.role===v?'selected':''}>${t}</option>`).join('')}</select></label><label>Status<select id="ka-statusfilter">${[['all','Semua status'],['true','Aktif'],['false','Nonaktif']].map(([v,t])=>`<option value="${v}" ${state.status===v?'selected':''}>${t}</option>`).join('')}</select></label></div><section id="ka-userlist" class="ka-panel ka-tablepanel">${userRows()}</section>`;}
function userDetail(){const u=users.find(x=>x.id===state.selected);return `${btn(`${ico('arrow-left')} Pengguna`,'nav:users')}<div style="margin-top:20px">${title(esc(u.name),'@'+esc(u.username),badge(roleName(u.role)))}</div><section class="ka-panel"><h2>Informasi akun</h2><dl class="ka-dl"><dt>Status</dt><dd>${badge(u.active?'Aktif':'Nonaktif',u.active?'ka-good':'')}</dd><dt>Terakhir masuk</dt><dd>${u.last}</dd><dt>Peran</dt><dd>${roleName(u.role)}</dd><dt>ID contoh</dt><dd>USR-${String(u.id).padStart(3,'0')}</dd></dl></section><section class="ka-panel"><h2>Kelola akses</h2><div class="ka-actions">${btn('Edit profil dan peran',`edit-user:${u.id}`)}${btn('Reset sandi contoh',`reset:${u.id}`)}${btn(u.active?'Nonaktifkan akun':'Aktifkan akun',`toggle:${u.id}`,false,u.id===1?'disabled':'')}${btn('Hapus akun contoh',`delete:${u.id}`,false,u.id===1?'disabled':'')}</div><p style="margin:16px 0 0" class="ka-muted">${u.id===1?'Akun admin sendiri tidak dapat dinonaktifkan, dihapus, atau diturunkan perannya.':'Nonaktifkan akses tanpa menghapus riwayat belajar. Penghapusan memerlukan konfirmasi terpisah.'}</p></section>${confirmation()}`;}
function userForm(){const u=state.selected?users.find(x=>x.id===state.selected):null;return `${btn(`${ico('arrow-left')} Kembali`,'cancel-form')}<div style="margin-top:20px">${title(u?'Edit pengguna':'Tambah pengguna','Gunakan data contoh untuk mencoba alur ini.')}</div><form id="ka-userform" class="ka-panel"><div class="ka-formgrid"><label>Nama lengkap<input name="name" required maxlength="200" value="${esc(u?.name||'')}"></label><label>Username<input name="username" required pattern="[a-zA-Z0-9._-]{3,64}" value="${esc(u?.username||'')}" ${u?'readonly':''}><small>3–64 karakter: huruf, angka, titik, garis bawah, atau tanda hubung.</small></label><label>Peran<select name="role" ${u?.id===1?'disabled':''}>${['student','teacher','admin'].map(r=>`<option value="${r}" ${u?.role===r?'selected':''}>${roleName(r)}</option>`).join('')}</select></label>${!u?'<label>Sandi sementara contoh<input name="password" type="password" required minlength="8" maxlength="72" autocomplete="off"><small>Minimal 8 karakter. Jangan masukkan sandi asli.</small></label>':''}</div><div id="ka-formerror" role="alert"></div><div class="ka-actions"><button class="ka-btn ka-primary" type="button" data-action="save-form">Simpan pengguna</button>${btn('Batal','cancel-form')}</div></form>`;}
function confirmation(){if(!state.confirm)return '';const c=state.confirm;return `<section class="ka-panel" aria-label="Konfirmasi tindakan"><h2>${esc(c.title)}</h2><p>${esc(c.message)}</p><div class="ka-actions">${btn(c.label,'confirm',true)}${btn('Batal','cancel-confirm')}</div></section>`;}
function inviteList(){return title('Kode undangan','Bantu siswa dan guru membuat akun dengan kode pendaftaran.',btn(`${ico('plus')} Buat kode`,'new-invite',true))+`<div class="ka-notice">Kode mengizinkan pendaftaran siswa atau guru. Kode tidak otomatis memasukkan pengguna ke kelas dan tidak membuat akun admin.</div>${state.form==='invite'?`<form id="ka-inviteform" class="ka-panel"><h2>Undangan baru</h2><div class="ka-formgrid"><label class="ka-full">Label<input name="label" required maxlength="100" placeholder="Contoh: Siswa angkatan baru"></label><label>Kuota penggunaan<input type="number" name="max" min="1" max="1000" required value="10"></label><label>Berlaku selama (hari)<input type="number" name="days" min="1" max="365" required value="14"></label></div><div class="ka-actions"><button type="button" data-action="save-form" class="ka-btn ka-primary">Buat kode contoh</button>${btn('Batal','cancel-invite')}</div></form>`:''}<section class="ka-panel ka-tablepanel"><table><thead><tr><th>Kode & label</th><th>Penggunaan</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${invites.map(v=>`<tr><td><strong>${v.code}</strong><small>${esc(v.label)}</small></td><td data-label="Kuota">${v.used} / ${v.max}<small>Berlaku ${v.days} hari sejak dibuat</small></td><td>${badge(!v.active?'Dicabut':v.used>=v.max?'Kuota habis':'Aktif',v.active&&v.used<v.max?'ka-good':'')}</td><td>${btn('Cabut',`revoke:${v.id}`,false,!v.active?'disabled':'')}</td></tr>`).join('')}</tbody></table></section>${confirmation()}`;}
function classes(){return title('Kelas & materi','Pantau penanggung jawab dan kesiapan materi pembelajaran.')+subjects.map(c=>`<section class="ka-panel"><div class="ka-panelhead"><div><h2>${c.name}</h2><small>${c.subject} · ${c.teacher}</small></div>${badge(c.status,c.id===1?'ka-good':'ka-warn')}</div><div class="ka-row"><div><strong>${c.material}</strong><p>${c.students} siswa terdaftar · 1 materi contoh</p></div>${btn('Lihat detail',`class:${c.id}`)}</div></section>`).join('');}
function classDetail(){const c=subjects.find(x=>x.id===state.selected);return `${btn(`${ico('arrow-left')} Kelas & materi`,'nav:classes')}<div style="margin-top:20px">${title(c.name,c.subject)}</div><section class="ka-panel"><h2>Penanggung jawab</h2><p>${c.teacher}</p><h2>Materi pembelajaran</h2><div class="ka-row"><div><strong>${c.material}</strong><p>1 dokumen sumber · versi contoh</p></div>${badge(c.status,c.id===1?'ka-good':'ka-warn')}</div><div class="ka-notice">Guru meninjau isi materi dan soal. Admin memantau kesiapan serta penanggung jawab kelas.</div></section><section class="ka-panel"><h2>Daftar siswa contoh</h2>${users.filter(u=>u.role==='student'&&(c.id===1?u.id!==6:u.id===6)).map(u=>`<div class="ka-row"><div><strong>${esc(u.name)}</strong><small>@${esc(u.username)}</small></div>${btn('Lihat akun',`user:${u.id}`)}</div>`).join('')}</section>`;}
function logRows(){const list=logs.filter(l=>(state.logType==='all'||l.type===state.logType)&&`${l.actor} ${l.action} ${l.target}`.toLowerCase().includes(state.logQuery.toLowerCase()));return list.length?`<table><thead><tr><th>Aktivitas</th><th>Pelaku</th><th>Hasil</th><th>Aksi</th></tr></thead><tbody>${list.map(l=>`<tr><td><strong>${esc(l.action)}</strong><small>${esc(l.time)}</small></td><td>${esc(l.actor)}<small>${esc(l.target)}</small></td><td>${badge(l.result,l.result==='Gagal'?'ka-bad':'ka-good')}</td><td>${btn('Detail',`log:${l.id}`)}</td></tr>`).join('')}</tbody></table><div class="ka-tablefoot">${list.length} aktivitas · tidak dapat diedit melalui tampilan ini</div>`:'<div class="ka-empty">Tidak ada aktivitas yang cocok dengan filter.</div>';}
function logList(){return title('Log aktivitas','Telusuri perubahan akun, materi, dan kejadian layanan.')+`<div class="ka-filters"><label>Cari aktivitas<input id="ka-logquery" type="search" value="${esc(state.logQuery)}" placeholder="Pelaku, tindakan, atau target"></label><label>Kategori<select id="ka-logtype">${['all','Akun','Pengguna','Undangan','Materi','Layanan','Pengaturan'].map(t=>`<option value="${t}" ${state.logType===t?'selected':''}>${t==='all'?'Semua kategori':t}</option>`).join('')}</select></label></div><section id="ka-loglist" class="ka-panel ka-tablepanel">${logRows()}</section>`;}
function logDetail(){const l=logs.find(x=>x.id===state.selected);return `${btn(`${ico('arrow-left')} Log aktivitas`,'nav:logs')}<div style="margin-top:20px">${title('Detail aktivitas',esc(l.action),badge(l.result,l.result==='Gagal'?'ka-bad':'ka-good'))}</div><section class="ka-panel"><dl class="ka-dl"><dt>Waktu</dt><dd>${esc(l.time)}</dd><dt>Pelaku</dt><dd>${esc(l.actor)}</dd><dt>Kategori</dt><dd>${l.type}</dd><dt>Target</dt><dd>${esc(l.target)}</dd><dt>Rincian</dt><dd>${esc(l.detail)}</dd><dt>ID kejadian contoh</dt><dd>EVT-${l.id}</dd></dl></section>`;}
function services(){return title('AI & suara','Pantau penggunaan dan kendala layanan pembelajaran.')+`<div class="ka-notice">Status di bawah adalah contoh desain, bukan hasil pemeriksaan koneksi. Belum ada panggilan OpenAI atau ElevenLabs.</div><div class="ka-grid"><section class="ka-panel"><div class="ka-panelhead"><h2>OpenAI / ChatGPT</h2>${badge('Belum dihubungkan')}</div><p class="ka-muted">Tutor, penjelasan, dan penyusunan soal.</p><div class="ka-row"><span>Permintaan contoh</span><strong>148</strong></div><div class="ka-row"><span>Token contoh</span><strong>42.800</strong></div><small>Periode 9–15 September 2026</small></section><section class="ka-panel"><div class="ka-panelhead"><h2>ElevenLabs</h2>${badge('Belum dihubungkan')}</div><p class="ka-muted">Pembacaan jawaban dan materi belajar.</p><div class="ka-row"><span>Audio contoh</span><strong>31 berhasil / 1 gagal</strong></div><div class="ka-row"><span>Karakter contoh</span><strong>18.200</strong></div><small>Periode 9–15 September 2026</small></section></div><section class="ka-panel"><h2>Kejadian layanan</h2><div class="ka-row"><div>${badge('Gagal','ka-bad')}<h3 style="margin-top:10px">Audio materi pecahan</h3><p>Respons penyedia melewati batas waktu pada contoh.</p></div>${btn('Detail kejadian','log:2')}</div></section><section class="ka-panel"><h2>Kredensial layanan</h2><p class="ka-muted">Kunci API dikelola pada konfigurasi server. Dashboard menampilkan status koneksi tanpa memperlihatkan kunci.</p></section>`;}
function settings(){return title('Pengaturan','Identitas sekolah, preferensi, dan pembagian akses.')+`<form id="ka-settingsform" class="ka-panel"><h2>Identitas & preferensi</h2><div class="ka-formgrid"><label>Nama sekolah<input name="school" maxlength="120" required value="${esc(state.school)}"></label><label>Bahasa utama<select name="language"><option value="id" ${state.language==='id'?'selected':''}>Bahasa Indonesia</option><option value="en" ${state.language==='en'?'selected':''}>English</option></select></label></div><p class="ka-muted">Bahasa ini dicatat sebagai preferensi sekolah pada simulasi; antarmuka prototipe tetap berbahasa Indonesia.</p><label class="ka-check"><input name="large" type="checkbox" ${state.large?'checked':''}>Perbesar teks pada pratinjau admin</label><div class="ka-actions" style="margin-top:20px"><button type="button" data-action="save-form" class="ka-btn ka-primary">Simpan pengaturan</button></div></form><section class="ka-panel"><h2>Peran & hak akses</h2><div class="ka-rolegrid">${[['Admin',['Kelola pengguna dan undangan','Lihat analytics dan log','Pantau layanan sekolah']],['Guru',['Kelola kelas dan materi','Tinjau dan bagikan soal','Pantau progres siswa']],['Siswa',['Belajar bersama tutor','Kerjakan kuis','Lihat progres sendiri']]].map(([r,list])=>`<div><h3>${r}</h3><ul>${list.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}</div><small>Pembagian peran tetap. Mengubah peran akun dilakukan melalui menu Pengguna.</small></section>`;}
function render(){const current=pages.find(p=>p[0]===state.page)?.[1]||({user:'Detail pengguna','user-form':'Form pengguna',log:'Detail aktivitas',class:'Detail kelas'}[state.page]||'Admin');shell.innerHTML=`<aside class="ka-side"><div>${root.querySelector('#ka-brand').innerHTML}<small>Ruang admin</small></div><nav aria-label="Navigasi admin">${pages.map(([id,t,i])=>`<button type="button" class="ka-nav" data-action="nav:${id}" ${state.page===id?'aria-current="page"':''}>${ico(i)} ${t}</button>`).join('')}</nav><div class="ka-sidefoot"><strong>${esc(state.school)}</strong><p><small style="padding:0;text-transform:none;letter-spacing:0">Tahun ajaran 2026/2027</small></p></div></aside><div><header class="ka-top"><span>Ruang admin / ${current}</span><div class="ka-topuser"><span class="ka-avatar">BS</span><strong>Bayu</strong>${badge('Admin')}</div><label class="ka-mobile">Menu admin<select id="ka-mobile-nav">${pages.map(([id,t])=>`<option value="${id}" ${state.page===id?'selected':''}>${t}</option>`).join('')}</select></label></header><main class="ka-content" style="font-size:${state.large?19:16}px">${({home,analytics,users:userList,user:userDetail,'user-form':userForm,invites:inviteList,classes,class:classDetail,logs:logList,log:logDetail,services,settings}[state.page])()}</main></div>`;icons();}
function icons(){if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}});}
function go(page){state.page=page;state.form=null;state.confirm=null;render();announce(`Halaman ${pages.find(p=>p[0]===page)?.[1]||'detail'} ditampilkan.`);}
root.addEventListener('click',e=>{const d=e.target.closest('[data-device]');if(d){state.phone=d.dataset.device==='phone';root.querySelector('#ka-window').classList.toggle('ka-phone',state.phone);root.querySelectorAll('[data-device]').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.device==='phone')===state.phone)));return;}const b=e.target.closest('[data-action]');if(!b)return;const [a,val]=b.dataset.action.split(':');const id=Number(val);if(a==='save-form'){const f=b.closest('form');if(f.reportValidity())submitForm(f);return;}if(a==='nav'){go(val);return;}if(a==='user'||a==='log'||a==='class'){state.selected=id;go(a);return;}if(a==='new-user'){state.selected=null;go('user-form');return;}if(a==='edit-user'){state.selected=id;go('user-form');return;}if(a==='cancel-form'){go(state.selected?'user':'users');return;}if(a==='new-invite'){state.form='invite';render();return;}if(a==='cancel-invite'){state.form=null;render();return;}if(a==='cancel-confirm'){state.confirm=null;render();return;}if(['toggle','delete','reset'].includes(a)){const u=users.find(x=>x.id===id);if(u.id===1&&a!=='reset')return;state.confirm={action:a,id,title:a==='delete'?'Hapus akun contoh?':a==='reset'?'Reset sandi akun contoh?':u.active?'Nonaktifkan akun?':'Aktifkan akun?',message:a==='delete'?`Akun ${u.username} akan dihapus dari data simulasi. Pada aplikasi final, penghapusan juga berdampak pada data yang dimiliki akun.`:a==='reset'?`Simulasikan reset sandi ${u.username}. Tidak ada sandi asli yang dibuat atau dikirim.`:`Ubah akses masuk ${u.username}. Riwayat belajar tetap disimpan.`,label:a==='delete'?'Ya, hapus contoh':'Konfirmasi simulasi'};render();return;}if(a==='revoke'){const v=invites.find(x=>x.id===id);state.confirm={action:'revoke',id,title:'Cabut kode undangan?',message:`${v.code} tidak dapat dipakai untuk pendaftaran baru. Akun yang sudah terdaftar tetap ada.`,label:'Ya, cabut kode contoh'};render();return;}if(a==='confirm'){const c=state.confirm;if(!c)return;if(c.action==='revoke'){const v=invites.find(x=>x.id===c.id);v.active=false;addLog('Undangan','Mencabut kode',v.label,'Kode tidak lagi dapat digunakan pada simulasi.');}else{const u=users.find(x=>x.id===c.id);if(c.action==='delete'){users=users.filter(x=>x.id!==c.id);addLog('Pengguna','Menghapus akun contoh',u.username,'Akun dihapus dari data lokal prototipe.');state.page='users';}if(c.action==='toggle'){u.active=!u.active;addLog('Pengguna',u.active?'Mengaktifkan akun':'Menonaktifkan akun',u.username,`Status baru: ${u.active?'aktif':'nonaktif'}.`);}if(c.action==='reset')addLog('Pengguna','Simulasi reset sandi',u.username,'Tidak ada sandi asli yang dibuat, disimpan, atau dikirim.');}state.confirm=null;render();announce('Tindakan simulasi selesai dan tercatat pada Log aktivitas.');}});
root.addEventListener('input',e=>{if(e.target.id==='ka-userquery'){state.query=e.target.value;root.querySelector('#ka-userlist').innerHTML=userRows();icons();}if(e.target.id==='ka-logquery'){state.logQuery=e.target.value;root.querySelector('#ka-loglist').innerHTML=logRows();icons();}});
root.addEventListener('change',e=>{const id=e.target.id;if(id==='ka-mobile-nav'){go(e.target.value);return;}if(id==='ka-period'){state.period=e.target.value;render();announce('Periode analytics diperbarui.');}if(id==='ka-rolefilter'||id==='ka-statusfilter'){state[id==='ka-rolefilter'?'role':'status']=e.target.value;root.querySelector('#ka-userlist').innerHTML=userRows();icons();announce('Daftar pengguna diperbarui.');}if(id==='ka-logtype'){state.logType=e.target.value;root.querySelector('#ka-loglist').innerHTML=logRows();icons();announce('Daftar log diperbarui.');}});
function submitForm(f){const data=new FormData(f);if(f.id==='ka-userform'){const name=String(data.get('name')).trim(),username=String(data.get('username')).trim().toLowerCase(),u=users.find(x=>x.id===state.selected);if(!name||!/^[a-zA-Z0-9._-]{3,64}$/.test(username)||(!u&&String(data.get('password')||'').length<8)||users.some(x=>x.username===username&&x.id!==u?.id)){root.querySelector('#ka-formerror').innerHTML='<p class="ka-alert">Isi nama, username unik 3–64 karakter, dan sandi contoh minimal 8 karakter.</p>';return;}const role=u?.id===1?'admin':String(data.get('role'));if(u){u.name=name;u.role=role;addLog('Pengguna','Memperbarui profil',username,'Nama atau peran diperbarui pada simulasi.');}else{users.push({id:Math.max(...users.map(x=>x.id))+1,name,username,role,active:true,last:'Belum pernah masuk'});addLog('Pengguna','Membuat pengguna',username,`Peran ${roleName(role)}. Sandi contoh tidak disimpan.`);}go('users');announce('Pengguna tersimpan pada simulasi. Lihat perubahan di Log aktivitas.');}if(f.id==='ka-inviteform'){const label=String(data.get('label')).trim();if(!label||!Number.isInteger(Number(data.get('max')))||Number(data.get('max'))<1||Number(data.get('max'))>1000||!Number.isInteger(Number(data.get('days')))||Number(data.get('days'))<1||Number(data.get('days'))>365){announce('Isi label, kuota 1–1000, dan masa berlaku 1–365 hari.');return;}const id=invites.length+1;invites.unshift({id,code:`DEMO-${String(id).padStart(4,'2')}`,label,max:Number(data.get('max')),used:0,days:Number(data.get('days')),active:true});addLog('Undangan','Membuat kode undangan',label,'Kode simulasi; tidak berlaku untuk pendaftaran asli.');state.form=null;render();announce('Kode undangan contoh dibuat.');}if(f.id==='ka-settingsform'){const school=String(data.get('school')).trim();if(!school)return;state.school=school;state.language=String(data.get('language'));state.large=data.get('large')==='on';addLog('Pengaturan','Menyimpan pengaturan sekolah',school,'Identitas, preferensi bahasa, atau ukuran teks diperbarui pada simulasi.');render();announce('Pengaturan pratinjau tersimpan.');}}
root.addEventListener('submit',e=>{e.preventDefault();if(e.target.reportValidity())submitForm(e.target);});
root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input')&&e.target.closest('form')){e.preventDefault();submitForm(e.target.closest('form'));}});
render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>root.style.setProperty('--ka-radius',`${state.radius}px`)});tweak.addSlider(state,'radius',{label:'Sudut panel',min:8,max:24,unit:'px'});}
})();
</script>
