<script>
(() => {
const root=document.getElementById('km-blueprint');
const screen=root.querySelector('#km-screen');
const product=root.querySelector('#km-window');
const live=root.querySelector('#km-announcement');
const brand=root.querySelector('#km-brand').innerHTML;
const symbol=root.querySelector('#km-symbol').innerHTML;
const state={area:'landing',page:'home',phone:false,settings:false,large:false,mode:'reader',typed:'',sent:'',voice:'idle',quizIndex:0,answers:[],quizFinished:false,review:['pending','pending'],published:false};
const design={radius:20,accent:'#1d63d8'};
const icon=(name)=>`<i data-lucide="${name}" aria-hidden="true"></i>`;
const button=(label,action,classes='km-bt',extra='')=>`<button type="button" class="${classes}" data-action="${action}" ${extra}>${label}</button>`;
const escape=(text)=>String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tag=(text,cls='')=>`<span class="km-tag ${cls}">${text}</span>`;
const q=[{text:'Mana yang senilai dengan satu per dua?',options:['Dua per empat','Satu per empat','Tiga per empat'],correct:0,reason:'Dua dari empat bagian sama besar nilainya dengan satu dari dua bagian.'},{text:'Dua per empat ditambah satu per empat sama dengan ...',options:['Tiga per delapan','Tiga per empat','Dua per delapan'],correct:1,reason:'Penyebutnya sama. Jumlahkan pembilangnya: dua ditambah satu menjadi tiga per empat.'}];
function announce(text){live.textContent=text;}
function logo(){return `<button type="button" class="km-logo-button" data-action="landing" aria-label="KODMOD, kembali ke landing page">${brand}</button>`;}
function header(){let nav=state.area==='guru'?[['home','Dashboard'],['classes','Kelas'],['review','Kuis'],['analytics','Analitik']]:[['home','Beranda'],['learn','Belajar'],['quiz','Kuis'],['progress','Progres']];return `<header class="km-nav">${logo()}<nav class="km-navlinks km-app-navlinks" aria-label="Navigasi utama">${nav.map(([id,label])=>button(label,`page:${id}`,'',state.page===id?'aria-current="page"':'')).join('')}</nav><div class="km-user"><span class="km-avatar">${state.area==='guru'?'RD':'AR'}</span><span>${state.area==='guru'?'Bu Ratna':'Ahmad'}</span>${button(icon('settings-2'),'settings','km-bt','aria-label="Suara dan tampilan"')}</div></header>`;}
function bottom(){const nav=state.area==='guru'?[['home','Dashboard','house'],['classes','Kelas','book-open'],['review','Kuis','clipboard-check'],['analytics','Analitik','chart-no-axes-combined']]:[['home','Beranda','house'],['learn','Belajar','book-open'],['quiz','Kuis','clipboard-check'],['progress','Progres','chart-no-axes-combined']];return `<nav class="km-bottomnav" aria-label="Navigasi mobile">${nav.map(([id,label,ic])=>button(`${icon(ic)}${label}`,`page:${id}`,'',state.page===id?'aria-current="page"':'')).join('')}</nav>`;}
function settings(){return `<section class="km-settings" aria-label="Suara dan tampilan"><div class="km-heading"><h2>Nyaman dengan caramu</h2>${button('Tutup','settings','km-bt')}</div><fieldset class="km-options"><legend>Cara mendengarkan</legend><label class="km-option"><input type="radio" name="km-mode" value="reader" ${state.mode==='reader'?'checked':''}><span>Pembaca layar saya<br><small class="km-muted">Aplikasi tidak memutar suara sendiri.</small></span></label><label class="km-option"><input type="radio" name="km-mode" value="voice" ${state.mode==='voice'?'checked':''}><span>Suara KODMOD<br><small class="km-muted">Teks tetap tersedia. Suara belum aktif di pratinjau ini.</small></span></label></fieldset><label class="km-option"><input type="checkbox" id="km-large" ${state.large?'checked':''}>Perbesar teks belajar</label></section>`;}
function landing(){return `<header class="km-nav">${logo()}<nav class="km-navlinks km-marketing-links" aria-label="Navigasi landing page"><a href="#km-how">Cara belajar</a><a href="#km-for-teacher">Untuk guru</a><a href="#km-access">Aksesibilitas</a></nav>${button('Masuk','siswa','km-bt km-primary')}</header><main><section class="km-hero"><div class="km-hero-copy"><h1>Belajar dengan suara.<br>Pahami dengan caramu.</h1><p>Tanya materi, latih pemahaman, dan temukan jawaban langkah demi langkah bersama KODMOD.</p><div class="km-actions">${button(`Mulai belajar ${icon('arrow-right')}`,'siswa','km-bt km-primary')}${button('Lihat contoh sesi','tutor','km-bt')}</div><div class="km-note">${icon('headphones')} Untuk siswa tunanetra dan low vision</div></div><div class="km-book-scene"><div class="km-book-caption">Setiap pertanyaan membuka pemahaman.</div><div class="km-book"><div class="km-book-left">${symbol}<small>Matematika / Pecahan</small><h3>“Kenapa ½ sama dengan ²⁄₄?”</h3><small>Pertanyaan sederhana.<br>Pemahaman yang lebih dalam.</small></div><div class="km-book-right"><div><b>KODMOD</b><p>Bayangkan selembar kertas dibagi dua. Kalau setiap bagian dibagi dua lagi, apa yang berubah?</p></div><div class="km-book-footer">${icon('messages-square')} Contoh percakapan tutor</div></div></div></div></section><section id="km-how" class="km-section"><div class="km-section-title"><h2>Satu pertanyaan.<br>Banyak jalan untuk memahami.</h2></div><div class="km-steps">${[['Pilih materi','Mulai dari pelajaran yang disiapkan gurumu.'],['Ajak berdiskusi','Tanyakan yang belum jelas lewat suara atau teks.'],['Latih pemahaman','Coba soal singkat dan jelaskan alasanmu.'],['Kenali progres','Lihat yang sudah dipahami dan apa yang perlu diulang.']].map(([h,p],i)=>`<div><div class="km-step-number">${i+1}</div><h3>${h}</h3><p>${p}</p></div>`).join('')}</div></section><section id="km-for-teacher" class="km-section km-pale"><div class="km-duo"><div class="km-feature km-blue-panel"><h3>Ruang untuk bertanya.<br>Waktu untuk memahami.</h3><p>Belajar tanpa terburu-buru. Minta penjelasan yang lebih sederhana, ulangi materi, lalu coba lagi.</p>${button('Jelajahi ruang siswa','siswa','km-bt')}</div><div class="km-feature"><h3>Guru tetap mendampingi<br>setiap langkah.</h3><p>Siapkan materi, tinjau soal sebelum dibagikan, dan ketahui konsep yang perlu dibahas bersama siswa.</p>${button('Jelajahi ruang guru','guru','km-bt')}</div></div></section><section class="km-section" id="km-access"><div class="km-access"><div><h2>Akses belajar dimulai<br>dari pilihanmu.</h2><p class="km-muted">Suara, teks, dan navigasi yang jelas. Kamu memilih cara berinteraksi yang paling nyaman.</p></div><ul class="km-checklist"><li>${icon('keyboard')} Navigasi dengan keyboard</li><li>${icon('speech')} Mode pembaca layar</li><li>${icon('volume-2')} Kontrol suara di tanganmu</li><li>${icon('type')} Teks yang dapat diperbesar</li></ul></div></section><section class="km-section km-pale"><h2>Sebelum mulai belajar</h2><details><summary>Apakah saya harus menggunakan suara?</summary><p>Tidak. Kamu dapat mengetik, membaca transkrip, atau menggunakan pembaca layar. Audio aplikasi mengikuti pilihanmu.</p></details><details><summary>Bagaimana saya mendapatkan akun?</summary><p>Gunakan nama pengguna dari sekolah atau daftar dengan kode undangan yang diberikan administrator.</p></details><details><summary>Siapa yang menyiapkan materi dan kuis?</summary><p>Guru menyiapkan materi dan meninjau soal sebelum membagikan kuis. Tutor membantu kamu berlatih dan memahami materi.</p></details><details><summary>Apakah perlu koneksi internet?</summary><p>Layanan percakapan AI dan suara membutuhkan internet. Pratinjau ini memakai data contoh.</p></details></section><section class="km-last"><h2>Mulai dari satu pertanyaan.</h2><p class="km-muted">KODMOD menemani langkah belajarmu berikutnya.</p><div class="km-actions">${button('Saya siswa','siswa','km-bt km-primary')}${button('Saya guru','guru','km-bt')}</div></section></main><footer class="km-footer">${brand}<span>Pendidikan inklusif. Kesempatan untuk memahami.</span></footer>`;}
function studentHome(){return `<div class="km-heading"><div><div class="km-greeting">Halo, Ahmad.</div><h1>Mau belajar apa hari ini?</h1><p>Sedikit demi sedikit, kamu semakin paham.</p></div></div><section class="km-primarylesson"><div><small>Terakhir kamu belajar Matematika</small><h2>Pecahan senilai</h2><p>Kita sudah mengenal satu per dua. Sekarang, temukan pecahan lain yang nilainya sama.</p>${button(`Lanjut belajar ${icon('arrow-right')}`,'page:tutor','km-bt')}</div><div class="km-lesson-art" aria-hidden="true">${symbol}</div></section><div class="km-duo"><section class="km-panel">${tag('Dari Bu Ratna')}<h3 style="margin-top:18px">Ada kuis untukmu</h3><p>Pecahan senilai · 2 soal<br>Kerjakan sesuai ritmemu.</p>${button('Lihat kuis','page:quiz','km-bt')}</section><section class="km-panel">${tag('Perjalanan belajar')}<h3 style="margin-top:18px">Kenali pemahamanmu</h3><p>Lihat konsep yang sudah dilatih dan materi yang bisa kamu pelajari lagi.</p>${button('Lihat progres','page:progress','km-bt')}</section></div><div class="km-rowtitle"><h2>Materi dari gurumu</h2>${button('Lihat semua','page:learn','km-bt km-quiet')}</div><section class="km-panel"><div class="km-listrow"><div><h3>Pecahan dalam kehidupan sehari-hari</h3><p>Matematika · Bu Ratna Dewi</p></div>${button('Buka materi','page:learn','km-bt')}</div></section>`;}
function learn(){return `<div class="km-heading"><div><h1>Belajar</h1><p>Pilih materi, lalu diskusikan bersama KODMOD.</p></div></div><div class="km-stack"><section class="km-panel">${tag('Matematika')}<h2 style="margin-top:18px">Pecahan dalam kehidupan sehari-hari</h2><p>Pelajari bagian dari satu benda utuh, pecahan senilai, dan penjumlahan pecahan sederhana.</p><ul class="km-checklist"><li>${icon('check')} Mengenal satu per dua dan satu per empat</li><li>${icon('book-open')} Menemukan pecahan yang nilainya sama</li></ul><div class="km-actions" style="margin-top:22px">${button('Mulai belajar','page:tutor','km-bt km-primary')}</div></section><section class="km-panel"><h3>Materi berikutnya sedang disiapkan</h3><p>Materi baru dari gurumu akan muncul di sini setelah siap dipelajari.</p></section></div>`;}
function tutor(){return `<div class="km-reader">${button(`${icon('arrow-left')} Materi belajar`,'page:learn','km-back')}<div class="km-heading"><div><h1>Pecahan senilai</h1><p>Tujuan: mengenali pecahan yang nilainya sama.</p></div>${tag('Sesi latihan')}</div><section class="km-conversation"><div class="km-speaker">${symbol} KODMOD</div><p>Bayangkan satu lembar kertas dibagi menjadi dua bagian sama besar. Kamu mengambil satu bagian: itu satu per dua.</p><p>Kalau setiap bagian tadi dibagi dua lagi, seluruh kertas menjadi empat bagian. Bagian yang kamu pegang sekarang terdiri dari dua bagian kecil.</p><p><strong>Menurutmu, apakah banyak kertas yang kamu pegang berubah?</strong></p><details><summary>Sumber materi</summary><p>Contoh materi: Pecahan dalam kehidupan sehari-hari, bagian "Pecahan senilai", disiapkan Bu Ratna.</p></details></section>${state.sent?`<div class="km-bubble"><strong>Kamu</strong><br>${escape(state.sent)}</div><section class="km-conversation"><div class="km-speaker">${symbol} KODMOD</div><p>Banyak kertasnya tetap sama. Kita hanya membaginya menjadi bagian yang lebih kecil. Jadi, satu per dua sama nilainya dengan dua per empat.</p><small class="km-muted">Jawaban contoh untuk meninjau alur percakapan.</small><div class="km-actions" style="margin-top:18px">${button('Coba mini-kuis','page:mini','km-bt km-primary')}</div></section>`:''}<section class="km-controlbox"><div class="km-callstatus"><span class="km-dot"></span>${state.voice==='record'?'Simulasi: mendengarkan':state.voice==='transcribed'?'Transkrip contoh siap diperiksa':'Siap menerima pertanyaanmu'}</div><label for="km-question">Pertanyaan atau jawabanmu</label><textarea id="km-question" placeholder="Tulis pemikiranmu di sini...">${escape(state.typed)}</textarea><p class="km-formnote">Pratinjau ini tidak mengakses mikrofon. Tombol bicara memperagakan alurnya.</p><div class="km-actions">${button(`${icon(state.voice==='record'?'square':'mic')} ${state.voice==='record'?'Selesai bicara':'Simulasikan bicara'}`,'voice','km-bt')}${button(`Kirim ${icon('arrow-up')}`,'send','km-bt km-primary')}</div></section><div class="km-actions" style="margin-top:16px">${button('Jelaskan lebih sederhana','simplify','km-bt km-quiet')}${button('Akhiri sesi','page:progress','km-bt km-quiet')}</div></div>`;}
function mini(){return `<div class="km-reader">${button(`${icon('arrow-left')} Kembali ke tutor`,'page:tutor','km-back')}<section class="km-panel">${tag('Mini-kuis · Latihan')}<h1 style="margin-top:18px">Coba satu pertanyaan</h1><p>Mana yang senilai dengan satu per dua?</p><fieldset class="km-options"><legend>Pilih jawaban</legend><label class="km-option"><input name="km-mini" type="radio" value="yes">Dua per empat</label><label class="km-option"><input name="km-mini" type="radio" value="no">Satu per empat</label></fieldset>${button('Periksa pemahaman','mini-check','km-bt km-primary')}<div id="km-mini-feedback" role="status"></div></section></div>`;}
function quiz(){if(state.quizFinished)return result();if(state.quizIndex===0)return `<div class="km-reader"><div class="km-heading"><div><h1>Kuis dari guru</h1><p>Kerjakan satu soal dalam satu waktu.</p></div></div><section class="km-panel">${tag('Siap dikerjakan')}<h2 style="margin-top:20px">Pecahan senilai</h2><p>Bu Ratna Dewi · Matematika</p><ul class="km-checklist"><li>${icon('list-checks')} 2 soal pilihan ganda</li><li>${icon('clock-3')} Tanpa batas waktu pada contoh ini</li><li>${icon('message-square-text')} Pembahasan tersedia setelah selesai</li></ul><div class="km-actions" style="margin-top:24px">${button('Mulai kuis','quiz-start','km-bt km-primary')}</div></section></div>`;if(state.quizIndex===3)return `<div class="km-reader"><h1>Periksa sebelum mengirim</h1><p class="km-muted">Kamu sudah menjawab 2 dari 2 soal.</p><section class="km-panel">${q.map((item,i)=>`<div class="km-listrow"><div><strong>Soal ${i+1}</strong><p>${escape(item.options[state.answers[i]])}</p></div>${button('Ubah',`quiz-edit:${i+1}`,'km-bt')}</div>`).join('')}</section><div class="km-actions" style="margin-top:24px">${button('Kirim dan lihat hasil','quiz-finish','km-bt km-primary')}</div></div>`;const idx=state.quizIndex-1;const item=q[idx];return `<div class="km-reader"><div class="km-heading"><div><h1>Pecahan senilai</h1><p>Soal ${state.quizIndex} dari 2</p></div>${tag('Kuis guru')}</div><div class="km-progress-track" role="progressbar" aria-label="Soal yang sudah dijawab" aria-valuemin="0" aria-valuemax="2" aria-valuenow="${state.answers.filter(v=>v!==undefined).length}"><span style="width:${state.answers.filter(v=>v!==undefined).length*50}%"></span></div><section class="km-panel"><h2>${escape(item.text)}</h2><fieldset class="km-options"><legend>Pilih satu jawaban</legend>${item.options.map((v,i)=>`<label class="km-option"><input type="radio" name="km-answer" value="${i}" ${state.answers[idx]===i?'checked':''}>${v}</label>`).join('')}</fieldset><div class="km-actions">${button(state.quizIndex===2?'Periksa jawaban':'Simpan dan lanjut','quiz-next','km-bt km-primary')}${button('Kembali','quiz-back','km-bt')}</div></section></div>`;}
function score(){return state.answers.reduce((s,v,i)=>s+(v===q[i].correct?1:0),0);}
function result(){return `<div class="km-reader">${button(`${icon('arrow-left')} Beranda`,'page:home','km-back')}<section class="km-panel">${tag('Kuis selesai','km-green')}<h1 style="margin-top:20px">Terima kasih sudah mencoba.</h1><p>Ini hasil latihan pemahaman pecahanmu.</p><div class="km-resultnum">${score()} <small>dari 2 jawaban tepat</small></div><p>${score()===2?'Kamu sudah mengenali pecahan senilai dan menjumlahkan pecahan berpenyebut sama.':'Mari pelajari lagi bagian yang belum tepat. Kamu bisa kembali ke tutor kapan saja.'}</p></section><div class="km-rowtitle"><h2>Pahami jawabanmu</h2></div>${q.map((item,i)=>`<section class="km-panel" style="margin-bottom:16px">${tag(`Soal ${i+1} · ${state.answers[i]===item.correct?'Tepat':'Perlu diulang'}`,state.answers[i]===item.correct?'km-green':'km-amber')}<p style="margin-top:16px"><strong>${escape(item.text)}</strong></p><p>${item.reason}</p></section>`).join('')}<div class="km-actions">${button('Lihat progres','page:progress','km-bt km-primary')}${button('Diskusikan dengan tutor','page:tutor','km-bt')}</div></div>`;}
function progress(){return `<div class="km-reader"><div class="km-heading"><div><h1>Progres belajarmu</h1><p>Kenali yang sudah dipahami. Temukan langkah berikutnya.</p></div></div><section class="km-panel"><div class="km-speaker">${icon('sprout')} Selangkah lebih paham</div><h2>${state.quizFinished?'Kamu sudah menyelesaikan kuis pecahan.':'Kamu sedang berlatih pecahan senilai.'}</h2><p>${state.quizFinished?`Pada kuis terakhir, ${score()} dari 2 jawabanmu tepat. Baca pembahasan dan lanjutkan diskusi jika masih ada pertanyaan.`:'Kamu sudah memulai materi tentang pecahan. Kerjakan kuis untuk melihat pemahamanmu lebih jauh.'}</p>${button(`${icon('volume-2')} Simulasikan ringkasan suara`,'summary','km-bt')}<div id="km-summary" hidden class="km-notice">Pratinjau teks ringkasan: Halo Ahmad. Kamu sedang mempelajari pecahan. Lanjutkan dari konsep pecahan senilai bersama tutor.</div></section><div class="km-rowtitle"><h2>Langkah selanjutnya</h2></div><section class="km-panel"><h3>${state.quizFinished&&score()===2?'Ulangi dengan contoh lain':'Pelajari lagi pecahan senilai'}</h3><p>Minta contoh yang berbeda agar pemahamanmu semakin kuat.</p>${button('Lanjut bersama tutor','page:tutor','km-bt km-primary')}</section></div>`;}
function teacherHome(){const pending=state.review.filter(v=>v==='pending').length;return `<div class="km-heading"><div><div class="km-greeting">Selamat pagi, Bu Ratna.</div><h1>Ruang mengajar Anda</h1><p>Pantau kelas dan siapkan langkah belajar berikutnya.</p></div>${tag('Guru')}</div><section class="km-attention"><div class="km-heading" style="margin:0"><div>${tag(state.published?'Kuis sudah dibagikan':`${pending} soal perlu ditinjau`,state.published?'km-green':'km-amber')}<h2 style="margin-top:14px">Kuis pecahan untuk Kelas 10A</h2><p>${state.published?'Versi contoh sudah dipublikasikan ke kelas.':'Tinjau pertanyaan dan pembahasan sebelum dibagikan.'}</p></div>${button(state.published?'Lihat kuis':'Tinjau soal','page:review','km-bt km-primary')}</div></section><div class="km-summary"><div class="km-stat"><small>Kelas aktif</small><strong>2</strong><small>Tahun ajaran 2026/2027</small></div><div class="km-stat"><small>Siswa</small><strong>18</strong><small>Dua kelompok belajar</small></div><div class="km-stat"><small>Kuis dibagikan</small><strong>${state.published?2:1}</strong><small>Data pratinjau</small></div></div><div class="km-teacher-grid"><section><div class="km-rowtitle"><h2>Kelas Anda</h2>${button('Lihat semua','page:classes','km-bt km-quiet')}</div>${classesCards()}</section><section><div class="km-rowtitle"><h2>Aktivitas terbaru</h2></div><div class="km-panel"><div class="km-listrow"><div>${tag('Materi siap')}<p>Pecahan dalam kehidupan sehari-hari siap dipelajari Kelas 10A.</p><small class="km-muted">Hari ini, 08.10</small></div></div><div class="km-listrow"><div>${tag('Latihan siswa')}<p>Ahmad memulai sesi belajar pecahan senilai.</p><small class="km-muted">Hari ini, 08.25</small></div></div></div></section></div>`;}
function classesCards(){return [['Kelas 10A','Matematika','10 siswa'],['Kelas 11B','Bahasa Indonesia','8 siswa']].map(([name,subject,count])=>`<div class="km-class"><div class="km-classbar"></div>${tag(subject)}<h3>${name}</h3><p class="km-muted">${count} · Bu Ratna Dewi</p>${button('Lihat kelas',name==='Kelas 10A'?'page:class':'class-empty','km-bt')}</div>`).join('');}
function review(){const approved=state.review.filter(v=>v==='approved').length;return `<div class="km-reader">${button(`${icon('arrow-left')} Dashboard`,'page:home','km-back')}<div class="km-heading"><div><h1>Tinjau soal</h1><p>Pecahan senilai · Kelas 10A</p></div>${tag(state.published?'Dipublikasikan':`${approved} dari 2 disetujui`,state.published?'km-green':'')}</div>${q.map((item,i)=>`<section class="km-reviewquestion">${tag(`Soal ${i+1} · ${state.review[i]==='approved'?'Disetujui':state.review[i]==='rejected'?'Ditolak':'Perlu ditinjau'}`,state.review[i]==='approved'?'km-green':state.review[i]==='rejected'?'km-red':'km-amber')}<h3>${escape(item.text)}</h3><p class="km-muted">Pilihan: ${item.options.join(' / ')}</p><div class="km-answerkey">Kunci: ${item.options[item.correct]}</div><p style="margin:16px 0 0">${item.reason}</p>${!state.published?`<div class="km-actions">${button(`${icon('check')} Setujui`,`approve:${i}`,'km-bt',state.review[i]==='approved'?'aria-pressed="true"':'aria-pressed="false"')}${button('Tolak',`reject:${i}`,'km-bt',state.review[i]==='rejected'?'aria-pressed="true"':'aria-pressed="false"')}${button('Edit',`edit:${i}`,'km-bt')}</div><div id="km-edit-${i}" hidden style="margin-top:18px"><label for="km-edit-text-${i}" class="km-formfield">Pertanyaan soal ${i+1}</label><textarea id="km-edit-text-${i}">${escape(item.text)}</textarea><p class="km-formnote">Mengedit membatalkan persetujuan soal sampai ditinjau kembali.</p>${button('Simpan perubahan',`save-edit:${i}`,'km-bt')}</div>`:''}</section>`).join('')}${state.published?`<div class="km-notice" role="status">${approved} soal dibagikan ke Kelas 10A pada data pratinjau. Tidak ada data yang dikirim ke server.</div>`:`<div class="km-actions">${button(`Publikasikan ${approved} soal`,'publish','km-bt km-primary',approved===0?'disabled':'')}</div><div id="km-publish-confirm" hidden class="km-panel" style="margin-top:20px"><h3>Bagikan ke Kelas 10A?</h3><p>${approved} soal yang disetujui akan masuk kuis contoh. Soal ditolak atau belum ditinjau tidak disertakan.</p><div class="km-actions">${button('Ya, publikasikan contoh','publish-confirm','km-bt km-primary')}${button('Kembali meninjau','publish-cancel','km-bt')}</div></div>`}</div>`;}
function teacher(){if(state.page==='classes')return `<div class="km-heading"><div><h1>Kelas Anda</h1><p>Materi dan latihan untuk tiap kelompok belajar.</p></div></div><div class="km-duo">${classesCards()}</div>`;if(state.page==='class')return `${button(`${icon('arrow-left')} Semua kelas`,'page:classes','km-back')}<div class="km-heading"><div><h1>Kelas 10A</h1><p>Matematika · 10 siswa · Bu Ratna Dewi</p></div></div><div class="km-duo"><section class="km-panel"><h2>Materi</h2>${tag('Siap dipelajari','km-green')}<h3 style="margin-top:16px">Pecahan dalam kehidupan sehari-hari</h3><p>Konsep pecahan, pecahan senilai, dan penjumlahan sederhana.</p></section><section class="km-panel"><h2>Kuis</h2><h3>Pecahan senilai</h3><p>2 soal · ${state.published?'Dipublikasikan':'Draft perlu ditinjau'}</p>${button('Lihat soal','page:review','km-bt km-primary')}</section></div>`;if(state.page==='review')return review();if(state.page==='analytics')return `<div class="km-heading"><div><h1>Pemahaman siswa</h1><p>Kelas 10A · Matematika · Data pratinjau</p></div></div><section class="km-panel"><h2>Mulai dari konsep yang perlu dibahas</h2><p>Detail berikut mengikuti perjalanan contoh Ahmad di pratinjau siswa.</p><div class="km-listrow"><div><h3>Ahmad Rizki</h3><p>${state.quizFinished?`${score()} dari 2 jawaban tepat pada kuis pecahan.`:'Sedang mempelajari pecahan senilai. Kuis belum selesai.'}</p></div>${tag(state.quizFinished?'Hasil tersedia':'Sedang belajar')}</div><div class="km-notice">${state.quizFinished&&score()===2?'Tindak lanjut: ajak Ahmad mencoba contoh pecahan yang berbeda.':'Tindak lanjut: dampingi pembahasan tentang bagian yang sama besar.'}</div></section>`;return teacherHome();}
function render(){root.querySelectorAll('[data-area]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.area===state.area)));root.querySelectorAll('[data-device]').forEach(b=>b.setAttribute('aria-pressed',String((b.dataset.device==='phone')===state.phone)));product.classList.toggle('km-phone',state.phone);product.classList.toggle('km-largetext',state.large);if(state.area==='landing'){screen.innerHTML=landing();}else{let content=state.area==='guru'?teacher():state.page==='learn'?learn():state.page==='tutor'?tutor():state.page==='mini'?mini():state.page==='quiz'?quiz():state.page==='progress'?progress():studentHome();screen.innerHTML=header()+`<main class="km-app-main">${state.settings?settings():''}${content}</main>`+bottom();}if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:18,height:18}});}
function goto(area,page='home'){state.area=area;state.page=page;state.settings=false;state.voice='idle';announce('');render();}
root.addEventListener('input',event=>{if(event.target.id==='km-question')state.typed=event.target.value;});
root.addEventListener('change',event=>{const t=event.target;if(t.name==='km-mode'){state.mode=t.value;announce(state.mode==='reader'?'Mode pembaca layar dipilih.':'Mode Suara KODMOD dipilih. Pemutaran belum tersedia pada pratinjau.');}if(t.id==='km-large'){state.large=t.checked;product.classList.toggle('km-largetext',state.large);}});
root.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||!root.contains(b))return;if(b.dataset.area){goto(b.dataset.area);return;}if(b.dataset.device){state.phone=b.dataset.device==='phone';render();return;}const act=b.dataset.action;if(!act)return;
if(act==='landing'||act==='siswa'||act==='guru'){goto(act);return;}if(act==='tutor'){goto('siswa','tutor');return;}if(act.startsWith('page:')){goto(state.area,act.slice(5));return;}if(act==='settings'){state.settings=!state.settings;render();return;}
if(act==='voice'){if(state.voice==='record'){state.voice='transcribed';state.typed='Banyak kertasnya tetap sama, hanya jumlah bagiannya yang berubah.';}else{state.voice='record';}render();announce(state.voice==='record'?'Simulasi rekaman dimulai. Mikrofon tidak diakses.':'Transkrip contoh tersedia. Periksa sebelum mengirim.');return;}
if(act==='send'){if(!state.typed.trim()){announce('Tulis jawaban atau simulasikan bicara terlebih dahulu.');return;}state.sent=state.typed.trim();state.typed='';state.voice='idle';render();announce('Jawaban contoh tutor tersedia di percakapan.');return;}
if(act==='simplify'){state.sent='Tolong jelaskan lebih sederhana.';render();announce('Penjelasan contoh tersedia.');return;}
if(act==='mini-check'){const choice=screen.querySelector('input[name="km-mini"]:checked');const feedback=screen.querySelector('#km-mini-feedback');feedback.className='km-notice';feedback.textContent=!choice?'Pilih jawaban terlebih dahulu.':choice.value==='yes'?'Tepat. Dua dari empat bagian sama besar nilainya dengan satu dari dua bagian.':'Coba pikirkan lagi: satu per empat lebih kecil daripada satu per dua. Bandingkan dengan dua per empat.';return;}
if(act==='quiz-start'){state.quizIndex=1;render();return;}if(act.startsWith('quiz-edit:')){state.quizIndex=Number(act.split(':')[1]);render();return;}if(act==='quiz-back'){state.quizIndex=Math.max(0,state.quizIndex-1);render();return;}if(act==='quiz-next'){const chosen=screen.querySelector('input[name="km-answer"]:checked');if(!chosen){announce('Pilih satu jawaban sebelum melanjutkan.');return;}state.answers[state.quizIndex-1]=Number(chosen.value);state.quizIndex++;announce('');render();return;}if(act==='quiz-finish'){state.quizFinished=true;render();announce('Kuis contoh selesai. Hasil tersedia.');return;}
if(act==='summary'){const summary=screen.querySelector('#km-summary');summary.hidden=!summary.hidden;summary.textContent=state.quizFinished?`Pratinjau teks ringkasan: Halo Ahmad. Pada kuis pecahan, ${score()} dari dua jawabanmu tepat. Mari lanjutkan belajar bersama tutor.`:'Pratinjau teks ringkasan: Halo Ahmad. Kamu sedang mempelajari pecahan. Lanjutkan dari konsep pecahan senilai bersama tutor.';return;}
if(act.startsWith('approve:')||act.startsWith('reject:')){state.review[Number(act.split(':')[1])]=act.startsWith('approve')?'approved':'rejected';render();announce('Status soal diperbarui pada pratinjau.');return;}if(act.startsWith('edit:')){screen.querySelector(`#km-edit-${Number(act.split(':')[1])}`).hidden=false;return;}if(act.startsWith('save-edit:')){const i=Number(act.split(':')[1]);const text=screen.querySelector(`#km-edit-text-${i}`).value.trim();if(!text){announce('Pertanyaan tidak boleh kosong.');return;}q[i].text=text;state.review[i]='pending';render();announce('Perubahan disimpan. Soal perlu ditinjau kembali.');return;}
if(act==='publish'){screen.querySelector('#km-publish-confirm').hidden=false;return;}if(act==='publish-cancel'){screen.querySelector('#km-publish-confirm').hidden=true;return;}if(act==='publish-confirm'){if(!state.review.includes('approved'))return;state.published=true;render();announce('Publikasi contoh selesai.');return;}if(act==='class-empty'){announce('Kelas 11B belum memiliki materi pada pratinjau ini.');}
});
render();
function applyDesign(){root.style.setProperty('--km-radius',`${design.radius}px`);root.style.setProperty('--km-blue',design.accent);}
if(globalThis.Tweak){const tweak=new globalThis.Tweak({container:root,onChange:applyDesign});tweak.addSlider(design,'radius',{label:'Sudut panel',min:8,max:28,step:2,unit:'px'});tweak.addSelect(design,'accent',{label:'Biru tombol',options:[{label:'Biru utama',value:'#1d63d8'},{label:'Navy logo',value:'#103c80'}]});}
})();
</script>
